<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>きょうの一枚｜写真日記</title>

<!-- ファビコン -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

<!-- ホーム画面追加（PWA）対応 -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3A4358" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="きょうの一枚" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="lock-screen" id="lock-screen" style="display:none;">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">きょうの一枚はロックされています<br />PINを入力してください</div>
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="lock-input" id="lock-input" autocomplete="off" />
    <div class="lock-error" id="lock-error" style="display:none;">PINが違います</div>
  </div>
</div>
<div class="shell" id="shell">

  <header>
    <button class="menu-btn" id="menu-btn" aria-label="メニュー" aria-haspopup="true">⋯</button>
    <div class="menu-dropdown" id="menu-dropdown">
      <button class="menu-item" id="backup-btn">
        <span class="menu-item-icon">💾</span>バックアップを書き出す
      </button>
      <button class="menu-item" id="restore-btn">
        <span class="menu-item-icon">📥</span>バックアップから復元
      </button>
      <input type="file" id="restore-input" accept=".json,application/json" style="display:none;" />
      <button class="menu-item" id="set-pin-btn" style="display:none;">
        <span class="menu-item-icon">🔒</span>ロックを設定
      </button>
      <button class="menu-item" id="change-pin-btn" style="display:none;">
        <span class="menu-item-icon">🔁</span>PINを変更
      </button>
      <button class="menu-item" id="remove-pin-btn" style="display:none;">
        <span class="menu-item-icon">🔓</span>ロックを解除する
      </button>
    </div>
    <div class="eyebrow">One Photo A Day</div>
    <h1 class="handwritten">きょうの一枚</h1>
    <p class="handwritten">特別じゃない日を、特別に残す。</p>
  </header>

  <div class="notebook-row">
    <button class="notebook-btn" id="notebook-btn">
      <span class="nb-current-dot" id="nb-current-dot"></span>
      <span id="notebook-name">日記</span><span class="caret">▾</span>
    </button>
    <div class="notebook-dropdown" id="notebook-dropdown">
      <div class="notebook-list" id="notebook-list"></div>
      <button class="menu-item" id="new-notebook-btn">
        <span class="menu-item-icon">＋</span>新しい日記帳を作る
      </button>
    </div>
  </div>

  <div class="count-row">
    <div class="count"><b id="entry-count">0</b> 件の記録</div>
  </div>

  <div class="toolbar-row">
    <div class="view-toggle">
      <button class="view-tab active" id="tab-list" data-view="list">リスト</button>
      <button class="view-tab" id="tab-calendar" data-view="calendar">カレンダー</button>
    </div>
  </div>

  <div class="backup-toast" id="backup-toast"></div>

  <div class="entries" id="entries"></div>

  <div class="calendar-view" id="calendar-view" style="display:none;">
    <div class="cal-header">
      <button id="cal-prev" aria-label="前の月">‹</button>
      <div class="cal-title" id="cal-title"></div>
      <button id="cal-next" aria-label="次の月">›</button>
    </div>
    <div class="cal-weekdays">
      <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-day-entries" id="cal-day-entries"></div>
  </div>

  <button class="fab" id="fab-add" aria-label="新しい記録を追加">＋</button>
</div>

<div class="overlay" id="overlay" style="display:none;">
  <div class="sheet">
    <div class="sheet-header">
      <h2 class="handwritten" id="sheet-title">きょうの一枚を残す</h2>
      <button class="close-btn" id="close-sheet">×</button>
    </div>

    <button class="picker-btn" id="pick-photo-btn">📷 写真を選ぶ（複数可）</button>
    <input type="file" id="photo-input" accept="image/*" multiple style="display:none;" />

    <div class="preview-row" id="preview-row"></div>

    <label class="field-label" for="date-input">日付</label>
    <input type="date" class="date-input" id="date-input" />

    <label class="field-label" for="caption-input">ひとこと</label>
    <textarea class="caption-input" id="caption-input" placeholder="今日はどんな一日でしたか？（写真だけでもOK）"></textarea>

    <div class="save-error" id="save-error" style="display:none;">写真か、ひとことのどちらかを入れてください。</div>

    <button class="save-btn" id="save-btn">保存する</button>
  </div>
</div>

<div class="lightbox" id="lightbox" style="display:none;">
  <button class="close-btn" id="lightbox-close">×</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="前の写真">‹</button>
  <img id="lightbox-img" src="" alt="" />
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="次の写真">›</button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script src="script.js"></script>
</body>
</html>
